services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service (Production)
  # Internal network only — NEVER exposed directly to the public host.
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vetrx-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vetrx_prod_network

  # ----------------------------------------------------------------------------
  # REST Backend Service (Production)
  # Multi-stage, runs compiled JavaScript, non-root user.
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: vetrx-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      APP_URL: ${APP_URL:-https://vetrx.adcpmalappuram.in}
      API_URL: ${API_URL:-https://vetrx.adcpmalappuram.in/api}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      COOKIE_NAME: ${COOKIE_NAME:-vetrx_session}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://vetrx.adcpmalappuram.in}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://vetrx.adcpmalappuram.in/api/auth/google/callback}
    ports:
      # Exposed locally to VPS loopback for NGINX reverse proxy
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - vetrx_prod_network

  # ----------------------------------------------------------------------------
  # Frontend Static Web Server (Production)
  # Multi-stage, NGINX Alpine with gzip and SPA routing.
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: vetrx-frontend-prod
    restart: unless-stopped
    ports:
      # Exposed locally to VPS loopback for NGINX reverse proxy
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - vetrx_prod_network

volumes:
  postgres_prod_data:
    driver: local

networks:
  vetrx_prod_network:
    driver: bridge

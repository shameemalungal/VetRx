name: VetRx Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-app-foundation-ui
    paths:
      - 'web/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies without root workspace packages
        run: npm install --prefix web --workspaces=false

      - name: Build Android web assets
        working-directory: web
        run: npm run build:android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 3 -maxdepth 3 -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Capacitor Android project
        working-directory: web
        run: npx cap add android

      - name: Sync native plugins and assets
        working-directory: web
        run: npx cap sync android

      - name: Configure Android session cookies
        working-directory: web
        run: npm run android:configure

      - name: Assemble debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VetRx-android-debug
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
